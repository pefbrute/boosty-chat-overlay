<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#0055cc" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="940" height="230" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- STEP 1 CARD -->
  <g transform="translate(24, 24)" filter="url(#shadow)">
    <rect width="260" height="182" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="36" cy="36" r="16" fill="url(#blueGrad)" />
    <text x="36" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="64" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700">Откройте расширения</text>

    <!-- Mini Browser Address Pill with Enter badge -->
    <g transform="translate(18, 70)">
      <rect width="224" height="42" rx="8" fill="#0f172a" stroke="#0077ff" stroke-width="1.5" />
      <text x="14" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">🔒</text>
      <text x="34" y="26" fill="#38bdf8" font-family="SFMono-Regular, Menlo, Monaco, monospace" font-size="12" font-weight="600">browser://extensions</text>
      <!-- Enter Key Badge -->
      <rect x="178" y="9" width="38" height="24" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="197" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">↵ Enter</text>
    </g>

    <text x="24" y="146" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12">Введите адрес в строку браузера</text>
    <text x="24" y="164" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12">и нажмите клавишу Enter</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <g transform="translate(296, 105)">
    <circle cx="15" cy="10" r="14" fill="#334155" />
    <path d="M10 10 L18 10 M15 6 L19 10 L15 14" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- STEP 2 CARD -->
  <g transform="translate(338, 24)" filter="url(#shadow)">
    <rect width="260" height="182" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="36" cy="36" r="16" fill="url(#blueGrad)" />
    <text x="36" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="64" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700">Режим разработчика</text>

    <!-- Mini Toggle Visual with accurate target click -->
    <g transform="translate(18, 70)">
      <rect width="224" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">Режим разработчика</text>
      <!-- Switch ON with click glow -->
      <rect x="176" y="11" width="36" height="20" rx="10" fill="#0077ff" />
      <circle cx="202" cy="21" r="8" fill="#ffffff" />
    </g>

    <text x="24" y="146" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12">Нажмите переключатель в правом</text>
    <text x="24" y="164" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12">верхнем углу страницы браузера</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <g transform="translate(610, 105)">
    <circle cx="15" cy="10" r="14" fill="#334155" />
    <path d="M10 10 L18 10 M15 6 L19 10 L15 14" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- STEP 3 CARD -->
  <g transform="translate(652, 24)" filter="url(#shadow)">
    <rect width="264" height="182" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="34" cy="36" r="16" fill="url(#greenGrad)" />
    <text x="34" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="58" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="700">Перетащите папку extension</text>

    <!-- File Manager Structure (boosty-chat-overlay/ -> extension/) -> Drag Arrow -> Browser Window -->
    <g transform="translate(14, 58)">
      <!-- Mini File Manager Window -->
      <rect x="0" y="0" width="114" height="68" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <!-- Window Titlebar -->
      <rect x="0" y="0" width="114" height="14" rx="6" fill="#1e293b" />
      <circle cx="7" cy="7" r="2" fill="#ff5f56" />
      <circle cx="13" cy="7" r="2" fill="#ffbd2e" />
      <circle cx="19" cy="7" r="2" fill="#27c93f" />
      <text x="62" y="10" fill="#94a3b8" font-family="SFMono-Regular, Menlo, Monaco, monospace" font-size="7.5" font-weight="600" text-anchor="middle">boosty-chat-overlay/</text>

      <!-- Hierarchy indicator -->
      <text x="57" y="25" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">↓</text>

      <!-- Highlighted Folder extension/ Inside File Manager -->
      <rect x="14" y="29" width="86" height="31" rx="5" fill="#1e293b" stroke="#0077ff" stroke-width="1.5" />
      <text x="57" y="43" fill="#38bdf8" font-family="SFMono-Regular, Menlo, Monaco, monospace" font-size="9.5" font-weight="800" text-anchor="middle">📁 extension/</text>
      <text x="57" y="54" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Папка расширения</text>

      <!-- Drag Arrow -->
      <g transform="translate(118, 24)">
        <path d="M0 10 L14 10 M9 5 L14 10 L9 15" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Mini Browser Window with Drop Zone -->
      <g transform="translate(136, 0)">
        <rect x="0" y="0" width="100" height="68" rx="6" fill="#0f172a" stroke="#0077ff" stroke-width="1.5" stroke-dasharray="3,2" />
        <rect x="0" y="0" width="100" height="14" rx="6" fill="#1e293b" />
        <circle cx="7" cy="7" r="2" fill="#ff5f56" />
        <circle cx="13" cy="7" r="2" fill="#ffbd2e" />
        <circle cx="19" cy="7" r="2" fill="#27c93f" />
        <text x="58" y="10" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Расширения</text>
        <text x="50" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Отпустите extension</text>
        <rect x="10" y="42" width="80" height="18" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1" />
        <text x="50" y="54" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">✓ Boosty Chat Overlay</text>
      </g>
    </g>

    <text x="18" y="148" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700">✓ Расширение установлено</text>
    <text x="18" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">Зажмите папку extension и перетащите в браузер</text>
  </g>
</svg>
