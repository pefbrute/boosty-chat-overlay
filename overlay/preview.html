<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boosty Chat Overlay — Live Preview</title>
    <link rel="stylesheet" href="style.css">
    <style>
      html, body {
        background: transparent;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        padding: 0;
        width: 1920px;
      }
    </style>
  </head>
  <body>
    <main id="messages" aria-live="polite"></main>
    <script src="renderer.js"></script>
    <script>
      (function() {
        const container = document.querySelector('#messages');
        let currentFixtures = [];
        let currentConfig = null;

        function renderPreviewCards() {
          container.innerHTML = '';
          if (!Array.isArray(currentFixtures)) return;
          const items = currentConfig && currentConfig.newMessagePosition === 'top'
            ? [...currentFixtures].reverse()
            : currentFixtures;
          for (const item of items) {
            container.append(window.BoostyRenderer.createMessageCard(item));
          }
        }

        window.addEventListener('message', event => {
          // Directive 5: strict verification of source & event structure
          if (event.source !== window.parent) return;
          const data = event.data;
          if (!data || typeof data !== 'object') return;

          if (data.type === 'preview:set-config' && data.config) {
            currentConfig = data.config;
            window.BoostyRenderer.applyAppearanceConfig(document.documentElement, data.config);
            renderPreviewCards();
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'preview:ack' }, '*');
            }
          } else if (data.type === 'preview:set-fixtures') {
            currentFixtures = data.fixtures || [];
            renderPreviewCards();
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'preview:ack' }, '*');
            }
          } else if (data.type === 'preview:reset' && data.config) {
            currentConfig = data.config;
            window.BoostyRenderer.applyAppearanceConfig(document.documentElement, data.config);
            renderPreviewCards();
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'preview:ack' }, '*');
            }
          }
        });

        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'preview:ready' }, '*');
        }
      })();
    </script>
  </body>
</html>
