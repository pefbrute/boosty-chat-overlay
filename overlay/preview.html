<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boosty Chat Overlay — Live Preview</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='23.6 46.6 189 199'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='145.08' y1='76.15' x2='80.59' y2='296.08' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23EF7829'/%3E%3Cstop offset='1' stop-color='%23F15A2C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M44.3,164.5L76.9,51.6H127l-10.1,35c-0.1,0.2-0.2,0.4-0.3,0.6L90,179.6h24.8c-10.4,25.9-18.5,46.2-24.3,60.9 c-45.8-0.5-58.6-33.3-47.4-72.1 M90.7,240.6l60.4-86.9h-25.6l22.3-55.7c38.2,4,56.2,34.1,45.6,70.5 c-11.3,39.1-57.1,72.1-101.7,72.1C91.3,240.6,91,240.6,90.7,240.6z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <style>
      html, body {
        background: transparent;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        padding: 0;
        width: 1920px;
      }
    </style>
  </head>
  <body>
    <main id="messages" aria-live="polite"></main>
    <script src="renderer.js"></script>
    <script>
      (function() {
        const container = document.querySelector('#messages');
        let currentFixtures = [];
        let currentConfig = null;

        function renderPreviewCards(options = {}) {
          container.innerHTML = '';
          if (!Array.isArray(currentFixtures)) return;
          const items = currentConfig && currentConfig.newMessagePosition === 'top'
            ? [...currentFixtures].reverse()
            : currentFixtures;
          for (const item of items) {
            const card = window.BoostyRenderer.createMessageCard(item);
            container.append(card);
            window.BoostyRenderer.enterMessageCard(card, currentConfig || {}, { animate: false });
          }
          if (options.animateNewest && container.children.length > 0) {
            replayNewestCardAnimation();
          }
        }

        function replayNewestCardAnimation() {
          if (!container || container.children.length === 0) return;
          const isTop = currentConfig && currentConfig.newMessagePosition === 'top';
          const targetCard = isTop ? container.firstElementChild : container.lastElementChild;
          if (targetCard && window.BoostyRenderer) {
            window.BoostyRenderer.enterMessageCard(targetCard, currentConfig || {}, {
              animate: true,
              restart: true,
            });
          }
        }

        window.addEventListener('message', event => {
          // Directive 5: strict verification of source & event structure
          if (event.source !== window.parent) return;
          const data = event.data;
          if (!data || typeof data !== 'object') return;

          if (data.type === 'preview:set-config' && data.config) {
            currentConfig = data.config;
            window.BoostyRenderer.applyAppearanceConfig(document.documentElement, data.config);
            renderPreviewCards({ animateNewest: Boolean(data.animateNewest) });
            if (window.parent && window.parent !== window) {
              const rect = container.getBoundingClientRect();
              window.parent.postMessage({
                type: 'preview:ack',
                box: { width: rect.width || container.offsetWidth, height: rect.height || container.offsetHeight }
              }, '*');
            }
          } else if (data.type === 'preview:replay-animation') {
            if (data.config) {
              currentConfig = data.config;
              window.BoostyRenderer.applyAppearanceConfig(document.documentElement, data.config);
            }
            replayNewestCardAnimation();
          } else if (data.type === 'preview:update-position' && data.position) {
            const p = data.position;
            const root = document.documentElement;
            if (p.offsetX !== undefined) root.style.setProperty('--overlay-offset-x', `${p.offsetX}px`);
            if (p.offsetY !== undefined) root.style.setProperty('--overlay-offset-y', `${p.offsetY}px`);
            if (container) {
              if (p.horizontalAnchor) {
                container.classList.toggle('anchor-left', p.horizontalAnchor === 'left');
                container.classList.toggle('anchor-right', p.horizontalAnchor === 'right');
              }
              if (p.verticalAnchor) {
                container.classList.toggle('anchor-top', p.verticalAnchor === 'top');
                container.classList.toggle('anchor-bottom', p.verticalAnchor === 'bottom');
              }
            }
          } else if (data.type === 'preview:set-fixtures') {
            currentFixtures = data.fixtures || [];
            renderPreviewCards();
            if (window.parent && window.parent !== window) {
              const rect = container.getBoundingClientRect();
              window.parent.postMessage({
                type: 'preview:ack',
                box: { width: rect.width || container.offsetWidth, height: rect.height || container.offsetHeight }
              }, '*');
            }
          } else if (data.type === 'preview:reset' && data.config) {
            currentConfig = data.config;
            window.BoostyRenderer.applyAppearanceConfig(document.documentElement, data.config);
            renderPreviewCards();
            if (window.parent && window.parent !== window) {
              const rect = container.getBoundingClientRect();
              window.parent.postMessage({
                type: 'preview:ack',
                box: { width: rect.width || container.offsetWidth, height: rect.height || container.offsetHeight }
              }, '*');
            }
          }
        });

        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'preview:ready' }, '*');
        }
      })();
    </script>
  </body>
</html>
